name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ matrix.os }}-go-1.26-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.os }}-go-1.26-

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./...

  # A JPEG 2000 decoder that only ever runs little-endian has not been tested
  # where byte order matters. s390x is big-endian, and this package reads a
  # codestream byte by byte and reassembles multi-byte numbers from it -- the
  # exact shape in which an endianness assumption hides.
  #
  # And the SIMD kernels it calls through go-highway have a scalar FALLBACK for
  # every architecture without a hand-written path. Until this lane existed,
  # that fallback was never executed by anything: it was reached only on the
  # machines nobody tested on.
  #
  # poppler needs a C++ toolchain, libopenjp2 and their dependencies built for
  # each of these. This needs GOARCH.
  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, exec: "-exec=qemu-riscv64-static" }
          - { goarch: loong64, exec: "-exec=qemu-loongarch64-static" }
          - { goarch: ppc64le, exec: "-exec=qemu-ppc64le-static" }
          - { goarch: s390x,   exec: "-exec=qemu-s390x-static" }
          # 32-bit. Nothing here had ever been built for a 32-bit target,
          # let alone run on one -- and a 32-bit `int` is where a pixel count
          # that multiplies a width by a height stops fitting. poppler runs on
          # 32-bit ARM every day; this is not exotic ground.
          # 386 runs with NO emulator: a 386 ELF executes directly on the
          # x86-64 runner. That is not a convenience, it is a correctness
          # requirement. Measured on one commit of go-gfx/gfx, eight identical
          # lanes each:
          #
          #   under qemu-i386                    5 failures out of 8
          #   under qemu-i386, asyncpreemptoff=1 0 out of 8
          #   native on the same runner          0 out of 8
          #   under qemu-arm                     0 out of 8
          #
          # Each failure landed on a DIFFERENT input although the seed is
          # fixed, and the wrong value was a sign flip rather than a rounding
          # difference. qemu-i386 loses the guest's floating-point state across
          # the signal Go delivers for asynchronous preemption. Emulating 386
          # here would buy nothing and cost a lane that goes red at random.
          - { goarch: "386",   exec: "" }
          - { goarch: arm,     exec: "-exec=qemu-arm-static" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: GOARCH=${{ matrix.goarch }} go test ${{ matrix.exec }} ./...

  # Cross-compiling for darwin and windows is not running there. poppler and
  # pdfium are tested on both, so this is not new ground -- it is ground the
  # references hold and this repository did not: path handling, line endings and
  # file semantics are where a Linux-only suite is quietly incomplete.
  #
  # The coverage gate stays on ubuntu; these two lanes only run the tests.
  os-matrix:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go test ./...
